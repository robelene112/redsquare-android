name: Android native compatibility
on:
  push:
    branches: [codex/spaces-catch-up-proof-146]
  workflow_dispatch:
    inputs:
      spaces_catch_up:
        description: Focused Spaces search, activity, Android notification and cold link journey
        type: boolean
        default: false
      spaces_rooms:
        description: Focused Spaces room lifecycle and owned media checks
        type: boolean
        default: false
      spaces_files:
        description: Focused shared file library with real DocumentsUI and independent storage process recovery
        type: boolean
        default: false
      spaces_articles:
        description: Focused Space article editor, exact link and encrypted process recovery
        type: boolean
        default: false
      spaces_protected_chat:
        description: Focused protected Chat invitation and independent encrypted round trip
        type: boolean
        default: false
      spaces_conversation_overlays:
        description: Focused message-menu, edit, IME and reaction-details lifecycle check only
        type: boolean
        default: false
      spaces_startup_trace:
        description: Diagnostic initial-history sampling only, never a complete native acceptance run
        type: boolean
        default: false
      spaces_category_management:
        description: Separate public category-editor first-feedback journey, without pending-process recovery acceptance
        type: boolean
        default: false
      spaces_private_management:
        description: Exercise the separate restricted-channel native journey within the management scopes
        type: boolean
        default: false
      spaces_private_management_case:
        description: Restricted-channel, readiness, or private-category visibility and closure recovery journey
        type: choice
        options: [process, readiness, governance, category-access, membership, private-ownership, moderation]
        default: process
      runner_os:
        description: Standard x64 runner (alternate pool if the default is queued)
        type: choice
        options: [ubuntu-24.04, ubuntu-22.04]
        default: ubuntu-24.04
      source_ref:
        description: Optional exact source commit for baseline verification
        type: string
        default: ''
      scope:
        description: Verification scope
        type: choice
        default: full
        options: [spaces-journey-management, spaces-journey-management-android17, spaces-journey-discovery, spaces-journey-discovery-android17, spaces-journey, spaces-journey-android17, spaces-crypto, spaces-crypto-android17, received-storage, received-storage-android17, file-menu, file-menu-android17, wallet-draft, wallet-draft-android17, talk-launch-recovery, talk-launch-recovery-android17, talk-launch-route, talk-launch-route-android17, following-resilience, following-resilience-android17, following-partial, following-partial-android17, photo-large-rows, photo-large-rows-android17, photo-multistream, photo-multistream-android17, photo-continuation, photo-continuation-android17, photo-pages, photo-pages-android17, talk-idle-routes, talk-idle-routes-android17, talk-idle-recovery, talk-idle-recovery-android17, talk-account-replacement, talk-account-replacement-android17, read-deadline-conversation, read-deadline-conversation-android17, read-deadline-stack, read-deadline-stack-android17, read-deadline-profile, read-deadline-profile-android17, read-deadline, read-deadline-android17, selected-image, selected-image-android17, unfinished-text, unfinished-text-android17, store-rental-access, store-rental-access-android17, store-rental-creation, store-rental-creation-android17, store-withdrawal-history, store-withdrawal-history-android17, store-withdrawal-reservation, store-withdrawal-reservation-android17, store-withdrawal-viewport, store-withdrawal-viewport-android17, store-withdrawal-process, store-withdrawal-process-android17, store-proceeds, store-proceeds-android17, store-seller-currency, store-seller-currency-android17, store-crypto-viewport, store-crypto-viewport-android17, store-seller, store-seller-android17, store-purchase, store-purchase-android17, store-catalogue, store-catalogue-android17, vault-advanced-viewport, vault-advanced-viewport-android17, vault-rental-master, vault-rental-master-android17, vault-key-transfer, vault-key-transfer-android17, vault-advanced, vault-advanced-android17, vault-key-reservation, vault-key-reservation-android17, vault-rule-review, vault-rule-review-android17, vault-custom-access, vault-custom-access-android17, vault-completed-cleanup, vault-completed-cleanup-android17, vault-funding-race, vault-funding-race-android17, vault-upload-viewport, vault-upload-viewport-android17, vault-upload-process, vault-upload-process-android17, vault-upload-background, vault-upload-background-android17, vault-upload-cancel, vault-upload-cancel-android17, vault-provider, vault-provider-android17, vault-upload-large, vault-upload-large-android17, vault-upload-recovery, vault-upload-recovery-android17, vault-share, vault-share-android17, vault-minting, vault-minting-android17, vault-upload, vault-upload-android17, vault-reading, vault-reading-android17, talk-camera-single, talk-camera-single-android17, talk, talk-android17, talk-permission, talk-permission-android17, talk-fileshare, talk-fileshare-android17, talk-dial, talk-dial-android17, talk-active, talk-active-android17, talk-ownership, talk-ownership-android17, talk-process, talk-process-android17, talk-chat, talk-chat-android17, talk-controls, talk-controls-android17, talk-camera-lifecycle, talk-camera-lifecycle-android17, talk-lifecycle, talk-lifecycle-android17, talk-direct, talk-direct-android17, talk-invitation, talk-invitation-android17, talk-media, talk-media-android17,  fileshare-receive, fileshare-receive-android17, talk-capture, talk-capture-android17, talk-routing, talk-routing-android17, fileshare-large, fileshare-large-android17, fileshare, fileshare-android17, stack-links, stack-links-android17, scroll-io, scroll-io-android17, scroll-profile-android17, name-directory-isolation, name-directory-isolation-android17, name-directory-choice, name-directory-choice-android17, name-directory-node, name-directory-node-android17, name-directory-public, name-directory-public-android17, name-directory-cache, name-directory-cache-android17, name-directory-recovery, name-directory-recovery-android17, name-directory, name-directory-android17, stack-live, stack-live-android17, stack-public, stack-public-android17, post-submission, post-submission-android17, push-binding-cache-regression, push-binding-cache-regression-android17, feed-refresh-regression, feed-refresh-regression-android17, candidate-update, candidate-update-android17, chat-header-targets, chat-header-targets-android17, chat-grouping, chat-grouping-android17, destination-redesign, destination-redesign-android17, destination-journey, destination-journey-android17, loaded-media-motion, loaded-media-motion-android17, image-retry-motion, image-retry-motion-android17, destination-reveal, destination-reveal-android17, node-motion, node-motion-android17, node-regression, node-regression-android17, node-blocks, node-blocks-android17, wallet-input, wallet-input-android17, wallet-redesign, wallet-redesign-android17, wallet-design, wallet-design-android17, source-debug, activity-group-viewports, activity-group-viewports-android17, activity-groups, activity-groups-android17, activity-availability, activity-availability-android17, thread-narrow, thread-narrow-android17, thread-redesign, thread-redesign-android17, like-pulse, like-pulse-android17, feed-writing, feed-writing-android17, feed-redesign, feed-redesign-android17, profile-redesign, profile-redesign-android17, avatars, avatars-android17, first-use-motion, first-use-motion-android17, first-use, first-use-android17, module-header, module-header-android17, module-push, module-push-android17, module-shell, module-shell-android17, stack-editor, stack-editor-android17, ui-regression, ui-regression-android17, navigation-keyboard, navigation-keyboard-android17, navigation, navigation-android17, status-talkback-viewer, status-talkback-viewer-android17, image-viewer, image-viewer-android17, activity-revisions, activity-revisions-android17, activity-state, activity-state-android17, activity-inbox, activity-inbox-android17, profile-keyboard, profile-keyboard-android17, profile-editor, profile-editor-android17, profile-hierarchy, profile-hierarchy-android17, group-invitation-recovery, group-invitation-recovery-android17, group-invitation-share, group-invitation-share-android17, group-setup, group-setup-android17, chat-entry, chat-entry-android17, chat-identities, chat-identities-android17, conversation-filtering, conversation-filtering-android17, conversation-send, conversation-send-android17, conversation-viewport, conversation-viewport-android17, composer-work, composer-work-android17, composer-quote, composer-quote-android17, composer-publishing, composer-publishing-android17, composer, composer-android17, composer-draft, composer-draft-android17, composer-focus, composer-focus-android17, post-presentation, post-presentation-android17, agreement-group, agreement-group-android17, social-push-dismissal, social-push-dismissal-android17, status-motion, status-motion-android17, status-talkback, status-talkback-android17, status-recovery, status-recovery-android17, social-repeat-process, social-repeat-process-android17, social-isolation, social-isolation-android17, social-import, social-import-android17, social-repeat, social-repeat-android17, private-push-dismissal, private-push-dismissal-android17, private-history-viewport, private-history-viewport-android17, chat-photo-process, chat-photo-process-android17, agreement-surfaces, agreement-surfaces-android17, app-frame-motion-zero, app-frame-motion-zero-android17, app-frame-reading, app-frame-reading-android17, app-frame-motion, app-frame-motion-android17, app-frame, app-frame-android17, app-frame-viewport, app-frame-viewport-android17, publisher-routes, publisher-routes-android17, agreement-post-queue, agreement-post-queue-android17, agreement-recovery, agreement-recovery-android17, agreement, agreement-android17, policies, policies-android17, private-push-mute, private-push-mute-android17, chat-push-capacity, chat-push-capacity-android17, group-push, group-push-android17, chat-alerts, chat-alerts-android17, chat-history-process, chat-history-process-android17, chat-gifs, chat-gifs-android17, gifs, gifs-android17, social-push-process, social-push-process-android17, social-push, social-push-android17, chat-viewport, chat-viewport-android17, chat-keyboard, chat-keyboard-android17, chat-image-storage, chat-image-storage-android17, chat-images, chat-images-android17, chat-mute, chat-mute-android17, release-tail, release-tail-android17, chat-queue-process, chat-queue-process-android17, chat-queue-group, chat-queue-group-android17, chat-queue, chat-queue-android17, group-admin, group-admin-android17, group-ui, group-ui-android17, beta-ui, beta-ui-android17, chat, chat-android17, chat-ui, chat-ui-android17, chat-actions, chat-actions-android17, chat-public, chat-public-android17, notifications, notifications-android17, transfers, transfers-android17, wallet-talkback, wallet-talkback-android17, reports, reports-android17, controls, controls-android17, search, search-android17, full, full-android10, full-android17, feed, feed-android17, feed-typography, feed-typography-android17, update-android17, export, export-android17, import, import-android17, import-risk, import-risk-android17, import-storage, import-storage-android17, browse, browse-android17, following, following-android17, posting, posting-android17, queue, queue-android17, social, social-android17, quotes, quotes-android17, author, author-android17, images, images-android17, videos, videos-android17, profiles, profiles-android17, usernames, usernames-android17, video-public, video-public-android17, registry-public, registry-public-android17]
      diagnostic_partition:
        description: One full-suite partition for diagnosis only, never complete acceptance
        type: choice
        options: [all, chat, social, wallet]
        default: all
      diagnostic_stop_after:
        description: Optional feed-reading endpoint for a diagnostic Social prefix only
        type: string
        default: ''
      public_feed_read:
        description: Enable public reads for focused scopes (full suites always include all public-read gates)
        type: boolean
        default: false
      public_video_reference:
        description: Use the second signed public YouTube reference in opt-in video reads
        type: boolean
        default: false
      performance_version:
        description: Optional immutable signed performance version for isolated installation proof
        type: string
        default: ''
      main_reference_version:
        description: Signed main preview reference beside performance (29 or 35)
        type: choice
        options: ['29', '35']
        default: '29'
      candidate_version:
        description: Staged ordinary signed candidate for local-work update checks
        type: string
        default: ''
      candidate_reference_version:
        description: Ordinary signed update baseline (default preserves the inherited83 gate)
        type: choice
        options: ['83', '127', '131', '139']
        default: '83'
      module_update_observer_sha256:
        description: Optional exact signed emulator-only module continuity observer
        type: string
        default: ''
      android17_16kb:
        description: Use the experimental Android 17 x86_64 16 KB image
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-proof-${{ github.ref }}-${{ inputs.scope || 'source' }}${{ inputs.android17_16kb && '-16kb' || '' }}${{ inputs.spaces_private_management && format('-private-{0}', inputs.spaces_private_management_case || 'process') || '' }}${{ inputs.spaces_category_management && '-categories' || '' }}${{ inputs.spaces_conversation_overlays && '-conversation' || '' }}${{ inputs.spaces_catch_up && '-catch-up' || '' }}
  cancel-in-progress: true
jobs:
  native-proof:
    name: catch-up (${{ matrix.scope }})
    strategy:
      fail-fast: false
      matrix:
        partition: [all]
        scope: [spaces-journey, spaces-journey-android17]
    runs-on: ${{ inputs.runner_os || 'ubuntu-24.04' }}
    env:
      SPACES_CATCH_UP: "true"
      SPACES_ROOMS: ${{ inputs.spaces_rooms && 'true' || 'false' }}
      SPACES_FILES: ${{ inputs.spaces_files && 'true' || 'false' }}
      SPACES_ARTICLES: ${{ inputs.spaces_articles && 'true' || 'false' }}
      SPACES_CONVERSATION_OVERLAYS: ${{ inputs.spaces_conversation_overlays && 'true' || 'false' }}
      SPACES_PROTECTED_CHAT: ${{ inputs.spaces_protected_chat && 'true' || 'false' }}
      SPACES_STARTUP_TRACE: ${{ inputs.spaces_startup_trace && 'true' || 'false' }}
      SPACES_CATEGORY_MANAGEMENT: ${{ inputs.spaces_category_management && 'true' || 'false' }}
      SPACES_PRIVATE_MANAGEMENT: ${{ inputs.spaces_private_management && 'true' || 'false' }}
      SPACES_PRIVATE_MANAGEMENT_CASE: ${{ inputs.spaces_private_management_case || 'process' }}
    # Allow the expanded complete catalog plus SDK/tool provisioning to finish.
    # Individual native, host-process and UI deadlines remain in emulator-check.
    timeout-minutes: ${{ (matrix.scope == 'full' || startsWith(matrix.scope, 'full-')) && 120 || 60 }}
    steps:
      - name: Qualify conversation overlay scope
        if: inputs.spaces_conversation_overlays
        env:
          VERIFICATION_SCOPE: ${{ matrix.scope }}
        run: |
          case "$VERIFICATION_SCOPE" in
            spaces-journey|spaces-journey-android17) ;;
            *) echo 'Conversation overlays require the base Spaces journey scope' >&2; exit 2 ;;
          esac
      - name: Qualify private-channel native variant
        if: inputs.spaces_private_management
        env:
          VERIFICATION_SCOPE: ${{ matrix.scope }}
        run: |
          case "$VERIFICATION_SCOPE" in
            spaces-journey-management|spaces-journey-management-android17) ;;
            *) echo 'The private-channel variant requires a management journey scope' >&2; exit 2 ;;
          esac
      - name: Qualify diagnostic partition
        if: (inputs.diagnostic_partition && inputs.diagnostic_partition != 'all') || inputs.diagnostic_stop_after
        env:
          DIAGNOSTIC_PARTITION: ${{ inputs.diagnostic_partition || 'all' }}
          DIAGNOSTIC_STOP_AFTER: ${{ inputs.diagnostic_stop_after }}
          VERIFICATION_SCOPE: ${{ matrix.scope }}
        run: |
          case "$DIAGNOSTIC_PARTITION" in chat|social|wallet) ;; *) exit 2 ;; esac
          case "$VERIFICATION_SCOPE" in full-android10|full-android17) ;; *) exit 2 ;; esac
          case "$DIAGNOSTIC_STOP_AFTER" in ''|feed-reading) ;; *) exit 2 ;; esac
          if [[ -n "$DIAGNOSTIC_STOP_AFTER" && "$DIAGNOSTIC_PARTITION" != social ]]; then exit 2; fi
          echo 'Single-partition diagnostic only. Complete acceptance requires the ordinary three-job run.'
      - name: Validate optional 16 KB environment
        if: inputs.android17_16kb
        env:
          VERIFICATION_SCOPE: ${{ matrix.scope }}
        run: |
          case "$VERIFICATION_SCOPE" in
            full|*-android17) ;;
            *) echo 'The 16 KB choice requires an Android17 scope or full' >&2; exit 2 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3e9213c4085241f675bdadc19e27f2a4ff463bca
          persist-credentials: false
          # Retained native evidence is not a build or test input.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/
      - name: Record checked-out proof source
        env:
          PROOF_WORKFLOW_SHA: ${{ github.sha }}
          PROOF_RUNNER: ${{ inputs.runner_os || 'ubuntu-24.04' }}
        run: |
          mkdir -p .scratch
          git rev-parse HEAD | tee .scratch/proof-source.txt
          printf '%s\n' "$SPACES_CATEGORY_MANAGEMENT" > .scratch/proof-category-management.txt
          printf '%s\n' "$SPACES_PRIVATE_MANAGEMENT" > .scratch/proof-private-management.txt
          printf '%s\n' "$SPACES_PRIVATE_MANAGEMENT_CASE" > .scratch/proof-private-management-case.txt
          printf '%s\n' "$PROOF_WORKFLOW_SHA" | tee .scratch/proof-workflow.txt
          printf '%s\n' "$PROOF_RUNNER" | tee .scratch/proof-runner.txt
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            settings.gradle.kts
            build.gradle.kts
            core/build.gradle.kts
            app/build.gradle.kts
            push-gateway/build.gradle.kts
            spaces-service/build.gradle.kts
            gradle/wrapper/gradle-wrapper.properties
      - name: Locate dependency cache
        id: cache-path
        env:
          TASK_PROOF_SCOPE: ${{ matrix.scope || 'source' }}
          TASK_BUILD_KEY: ${{ hashFiles('gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'app/build.gradle.kts', 'push-gateway/build.gradle.kts', 'spaces-service/build.gradle.kts', 'gradle/**') }}
          TASK_PRODUCTION_KEY: ${{ hashFiles('app/src/main/**', 'app/src/debug/**', 'app/src/release/**', 'app/src/performance/**', 'core/src/main/**', 'push-gateway/src/main/**', 'spaces-service/src/main/**', 'spaces-mls/Cargo.toml', 'spaces-mls/Cargo.lock', 'spaces-mls/src/**', 'build-support/**', 'app/*.pro') }}
        run: |
          echo "home=$HOME" >> "$GITHUB_OUTPUT"
          printf 'task-version-key=%s-%s\n' "$RUNNER_OS" "$TASK_BUILD_KEY" >> "$GITHUB_OUTPUT"
          printf 'task-production=%s\n' "$TASK_PRODUCTION_KEY" >> "$GITHUB_OUTPUT"
          case "$TASK_PROOF_SCOPE" in
            full*|source|release-tail*) echo 'task-kind=complete' >> "$GITHUB_OUTPUT" ;;
            *) echo 'task-kind=debug' >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Restore dependencies from the earlier proof cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: redsquare-gradle-v1-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'app/build.gradle.kts', 'push-gateway/build.gradle.kts', 'spaces-service/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Restore verified build dependencies
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-path.outputs.home }}/.gradle/caches
          key: redsquare-gradle-v2-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'app/build.gradle.kts', 'push-gateway/build.gradle.kts', 'spaces-service/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            redsquare-gradle-v2-
            setup-java-Linux-x64-gradle-
      - name: Restore pinned Spaces compilers and Cargo outputs
        if: hashFiles('spaces-mls/Cargo.lock') != ''
        id: spaces-native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-path.outputs.home }}/.gradle/spaces-tools
          key: spaces-native-v1-${{ inputs.runner_os || 'ubuntu-24.04' }}-${{ hashFiles('build-support/spaces-toolchain.json', 'spaces-mls/Cargo.lock') }}-${{ hashFiles('spaces-mls/src/**', 'spaces-mls/tests/**', 'build-support/spaces-mls.py') }}
          restore-keys: |
            spaces-native-v1-${{ inputs.runner_os || 'ubuntu-24.04' }}-${{ hashFiles('build-support/spaces-toolchain.json', 'spaces-mls/Cargo.lock') }}-
      - name: Restore Gradle task outputs
        id: task-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-path.outputs.home }}/.gradle/caches/build-cache-1
          # Seed current production outputs once, then reuse them for fixture-only
          # changes. Separate complete/debug keys prevent a focused run from fixing
          # an incomplete seed for release/lint. Gradle still checks all task inputs.
          key: redsquare-gradle-tasks-v3-${{ steps.cache-path.outputs.task-version-key }}-${{ steps.cache-path.outputs.task-kind }}-${{ steps.cache-path.outputs.task-production }}
          restore-keys: |
            redsquare-gradle-tasks-v3-${{ steps.cache-path.outputs.task-version-key }}-complete-${{ steps.cache-path.outputs.task-production }}
            redsquare-gradle-tasks-v3-${{ steps.cache-path.outputs.task-version-key }}-debug-${{ steps.cache-path.outputs.task-production }}
            redsquare-gradle-tasks-v3-${{ steps.cache-path.outputs.task-version-key }}-complete-
            redsquare-gradle-tasks-v3-${{ steps.cache-path.outputs.task-version-key }}-debug-
            redsquare-gradle-tasks-v2-${{ runner.os }}-${{ hashFiles('gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'app/build.gradle.kts', 'push-gateway/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
            redsquare-gradle-tasks-v1-${{ runner.os }}-${{ hashFiles('gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'app/build.gradle.kts', 'push-gateway/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Check runner SDK and acceleration
        run: |
          echo 'SDK preparation: verify KVM and runner disk'
          test -c /dev/kvm
          sudo timeout 30 chmod a+rw /dev/kvm
          df -h /
          TASK_FREE_BYTES=$(df -PB1 / | awk 'NR == 2 { print $4 }')
          # Native Kotlin proofs do not use the NDK. Remove it only when its
          # space is needed, with a visible bounded preparation step.
          if (( TASK_FREE_BYTES < 8 * 1024 * 1024 * 1024 )); then
            echo 'SDK preparation: reclaim unused NDK space'
            sudo timeout 180 rm -rf /usr/local/lib/android/sdk/ndk
            df -h /
          fi
          echo 'SDK preparation: verify installed runtime libraries'
          # Hosted probes found Ubuntu-domain DNS unavailable, while this Ubuntu
          # mirror resolves for both runner and APT users. Keep original fallbacks
          # and Ubuntu signature verification; only prefer the reachable mirror.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '1ihttps://mirrors.edge.kernel.org/ubuntu/\tpriority:0' /etc/apt/apt-mirrors.txt
            test -s /etc/apt/apt-mirrors.txt
          fi
          TASK_ALSA=libasound2t64
          TASK_GLIB=libglib2.0-0t64
          . /etc/os-release
          if [[ "$VERSION_ID" == '22.04' ]]; then
            TASK_ALSA=libasound2
            TASK_GLIB=libglib2.0-0
          fi
          TASK_LIBRARIES=(libpulse0 libgl1 libnss3 "$TASK_ALSA" libx11-6 libxcb1 libxkbcommon0 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxtst6 libxdamage1 "$TASK_GLIB")
          TASK_MISSING=()
          for TASK_LIBRARY in "${TASK_LIBRARIES[@]}"; do
            if [[ "$(dpkg-query -W -f='${db:Status-Status}' "$TASK_LIBRARY" 2>/dev/null)" != installed ]]; then
              TASK_MISSING+=("$TASK_LIBRARY")
            fi
          done
          # Reuse verified installed runtime libraries. A new emulator proof does
          # not require refreshing unrelated APT repositories on every hosted VM.
          printf 'SDK preparation: missing runtime libraries: %s\n' "${TASK_MISSING[*]}"
          if (( ${#TASK_MISSING[@]} )); then
            # The runner image normally already has signed package metadata.
            # Try the required packages before refreshing unrelated repositories.
            if ! sudo timeout 180 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends "${TASK_MISSING[@]}"; then
              sudo timeout 300 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
              sudo timeout 300 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends "${TASK_MISSING[@]}"
            fi
          fi
          dpkg-query -W -f='${binary:Package} ${Version} ${db:Status-Status}\n' "${TASK_LIBRARIES[@]}"
          echo 'SDK preparation: install pinned Android tools'
