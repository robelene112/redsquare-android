name: Android native compatibility
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope
        type: choice
        default: full
        options: [ social-push-process, social-push-process-android17, social-push, social-push-android17, chat-viewport, chat-viewport-android17, chat-keyboard, chat-keyboard-android17, chat-image-storage, chat-image-storage-android17, chat-images, chat-images-android17, chat-mute, chat-mute-android17, release-tail, release-tail-android17, chat-queue-process, chat-queue-process-android17, chat-queue-group, chat-queue-group-android17, chat-queue, chat-queue-android17, group-admin, group-admin-android17, group-ui, group-ui-android17, beta-ui, beta-ui-android17, chat, chat-android17, chat-ui, chat-ui-android17, chat-actions, chat-actions-android17, chat-public, chat-public-android17, notifications, notifications-android17, transfers, transfers-android17, reports, reports-android17, controls, controls-android17, search, search-android17, full, full-android10, full-android17, feed, feed-android17, update-android17, export, export-android17, import, import-android17, import-risk, import-risk-android17, import-storage, import-storage-android17, browse, browse-android17, following, following-android17, posting, posting-android17, queue, queue-android17, social, social-android17, quotes, quotes-android17, author, author-android17, images, images-android17, videos, videos-android17, profiles, profiles-android17, usernames, usernames-android17, video-public, video-public-android17, registry-public, registry-public-android17]
      public_feed_read:
        description: Separately verify both approved public peer feeds
        type: boolean
        default: false
      public_video_reference:
        description: Use the second signed public YouTube reference in opt-in video reads
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-proof-${{ github.ref }}-${{ inputs.scope || 'source' }}
  cancel-in-progress: true
jobs:
  native-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.scope == 'full' && 120 || startsWith(inputs.scope, 'full-') && 75 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            settings.gradle.kts
            build.gradle.kts
            core/build.gradle.kts
            app/build.gradle.kts
            gradle/wrapper/gradle-wrapper.properties
      - name: Locate dependency cache
        id: cache-path
        run: echo "home=$HOME" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies from the earlier proof cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: redsquare-gradle-v1-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'app/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Restore verified build dependencies
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-path.outputs.home }}/.gradle/caches
          key: redsquare-gradle-v2-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'app/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            redsquare-gradle-v2-
            setup-java-Linux-x64-gradle-
      - name: Restore Gradle task outputs
        id: task-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-path.outputs.home }}/.gradle/caches/build-cache-1
          key: redsquare-gradle-tasks-v1-${{ runner.os }}-${{ hashFiles('gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'app/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            redsquare-gradle-tasks-v1-${{ runner.os }}-${{ hashFiles('gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'app/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Check runner SDK and acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          # This Kotlin/JVM proof does not use the runner's large native SDKs.
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 libgl1 libnss3 libasound2t64 libx11-6 libxcb1 libxkbcommon0 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxtst6 libxdamage1 libglib2.0-0t64
          scripts/ci-android-setup
          java -version
          "$ANDROID_HOME/emulator/emulator" -version
      - name: Build and verify native sources
        id: build
        env:
          VERIFICATION_SCOPE: ${{ inputs.scope || 'source' }}
        run: |
          if [[ "$VERIFICATION_SCOPE" == full* || "$VERIFICATION_SCOPE" == source || "$VERIFICATION_SCOPE" == release-tail* ]]; then
            ./gradlew --no-daemon --console=plain :core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug
          else
            ./gradlew --no-daemon --console=plain :core:test :app:assembleDebug :app:assembleDebugAndroidTest
          fi
      - name: Retain Gradle task outputs before device tests
        if: steps.build.outcome == 'success' && steps.task-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-path.outputs.home }}/.gradle/caches/build-cache-1
          key: ${{ steps.task-cache.outputs.cache-primary-key }}
      - name: Retain dependencies before device tests
        if: steps.build.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-path.outputs.home }}/.gradle/caches
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Verify Android 10 runtime
        if: github.event_name == 'workflow_dispatch' && inputs.scope != 'social-push-process-android17' && inputs.scope != 'social-push-android17' && inputs.scope != 'chat-viewport-android17' && inputs.scope != 'chat-keyboard-android17' && inputs.scope != 'chat-image-storage-android17' && inputs.scope != 'chat-images-android17' && inputs.scope != 'chat-mute-android17' && inputs.scope != 'release-tail-android17' && inputs.scope != 'chat-queue-process-android17' && inputs.scope != 'chat-queue-group-android17' && inputs.scope != 'chat-queue-android17' && inputs.scope != 'group-admin-android17' && inputs.scope != 'group-ui-android17' && inputs.scope != 'beta-ui-android17' && inputs.scope != 'full-android17' && inputs.scope != 'feed-android17' && inputs.scope != 'update-android17' && inputs.scope != 'export-android17' && inputs.scope != 'import-android17' && inputs.scope != 'import-risk-android17' && inputs.scope != 'import-storage-android17' && inputs.scope != 'browse-android17' && inputs.scope != 'following-android17' && inputs.scope != 'posting-android17' && inputs.scope != 'queue-android17' && inputs.scope != 'social-android17' && inputs.scope != 'quotes-android17' && inputs.scope != 'author-android17' && inputs.scope != 'images-android17' && inputs.scope != 'videos-android17' && inputs.scope != 'profiles-android17' && inputs.scope != 'usernames-android17' && inputs.scope != 'video-public-android17' && inputs.scope != 'registry-public-android17' && inputs.scope != 'search-android17' && inputs.scope != 'controls-android17' && inputs.scope != 'reports-android17' && inputs.scope != 'transfers-android17' && inputs.scope != 'notifications-android17' && inputs.scope != 'chat-android17' && inputs.scope != 'chat-ui-android17' && inputs.scope != 'chat-actions-android17' && inputs.scope != 'chat-public-android17'
        env:
          TEST_PUBLIC_SIGNED_UPDATE: '1'
          TEST_PUBLIC_FEED_READ: ${{ inputs.public_feed_read && '1' || '0' }}
          TEST_PUBLIC_VIDEO_REFERENCE: ${{ inputs.public_video_reference && '1' || '0' }}
          TEST_SCOPE: ${{ inputs.scope == 'full-android10' && 'full' || inputs.scope || 'full' }}
        run: scripts/ci-android-device 29
      - name: Verify Android 17 runtime
        if: github.event_name == 'workflow_dispatch' && inputs.scope != 'social-push-process' && inputs.scope != 'social-push' && inputs.scope != 'chat-viewport' && inputs.scope != 'chat-keyboard' && inputs.scope != 'chat-image-storage' && inputs.scope != 'chat-images' && inputs.scope != 'chat-mute' && inputs.scope != 'release-tail' && inputs.scope != 'chat-queue-process' && inputs.scope != 'chat-queue-group' && inputs.scope != 'chat-queue' && inputs.scope != 'group-admin' && inputs.scope != 'group-ui' && inputs.scope != 'beta-ui' && inputs.scope != 'full-android10' && inputs.scope != 'feed' && inputs.scope != 'export' && inputs.scope != 'import' && inputs.scope != 'import-risk' && inputs.scope != 'import-storage' && inputs.scope != 'browse' && inputs.scope != 'following' && inputs.scope != 'posting' && inputs.scope != 'queue' && inputs.scope != 'social' && inputs.scope != 'quotes' && inputs.scope != 'author' && inputs.scope != 'images' && inputs.scope != 'videos' && inputs.scope != 'profiles' && inputs.scope != 'usernames' && inputs.scope != 'video-public' && inputs.scope != 'registry-public' && inputs.scope != 'search' && inputs.scope != 'controls' && inputs.scope != 'reports' && inputs.scope != 'transfers' && inputs.scope != 'notifications' && inputs.scope != 'chat' && inputs.scope != 'chat-ui' && inputs.scope != 'chat-actions' && inputs.scope != 'chat-public'
        env:
          TEST_SCOPE: ${{ inputs.scope == 'full-android17' && 'full' || inputs.scope || 'full' }}
          TEST_PUBLIC_SIGNED_UPDATE: '1'
          TEST_PUBLIC_FEED_READ: ${{ inputs.public_feed_read && '1' || '0' }}
          TEST_PUBLIC_VIDEO_REFERENCE: ${{ inputs.public_video_reference && '1' || '0' }}
        run: scripts/ci-android-device 37.0
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-proof
          path: |
            .scratch/device-evidence/
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html
          include-hidden-files: true
          retention-days: 14
