name: Android native compatibility
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope
        type: choice
        default: full
        options: [ composer-focus, composer-focus-android17, post-presentation, post-presentation-android17, agreement-group, agreement-group-android17, social-push-dismissal, social-push-dismissal-android17, status-motion, status-motion-android17, status-talkback, status-talkback-android17, status-recovery, status-recovery-android17, social-repeat-process, social-repeat-process-android17, social-isolation, social-isolation-android17, social-import, social-import-android17, social-repeat, social-repeat-android17, private-push-dismissal, private-push-dismissal-android17, private-history-viewport, private-history-viewport-android17, chat-photo-process, chat-photo-process-android17, agreement-surfaces, agreement-surfaces-android17, app-frame-motion-zero, app-frame-motion-zero-android17, app-frame-reading, app-frame-reading-android17, app-frame-motion, app-frame-motion-android17, app-frame, app-frame-android17, app-frame-viewport, app-frame-viewport-android17, publisher-routes, publisher-routes-android17, agreement-recovery, agreement-recovery-android17, agreement, agreement-android17, policies, policies-android17, private-push-mute, private-push-mute-android17, chat-push-capacity, chat-push-capacity-android17, group-push, group-push-android17, chat-alerts, chat-alerts-android17, chat-history-process, chat-history-process-android17, chat-gifs, chat-gifs-android17, gifs, gifs-android17, social-push-process, social-push-process-android17, social-push, social-push-android17, chat-viewport, chat-viewport-android17, chat-keyboard, chat-keyboard-android17, chat-image-storage, chat-image-storage-android17, chat-images, chat-images-android17, chat-mute, chat-mute-android17, release-tail, release-tail-android17, chat-queue-process, chat-queue-process-android17, chat-queue-group, chat-queue-group-android17, chat-queue, chat-queue-android17, group-admin, group-admin-android17, group-ui, group-ui-android17, beta-ui, beta-ui-android17, chat, chat-android17, chat-ui, chat-ui-android17, chat-actions, chat-actions-android17, chat-public, chat-public-android17, notifications, notifications-android17, transfers, transfers-android17, reports, reports-android17, controls, controls-android17, search, search-android17, full, full-android10, full-android17, feed, feed-android17, update-android17, export, export-android17, import, import-android17, import-risk, import-risk-android17, import-storage, import-storage-android17, browse, browse-android17, following, following-android17, posting, posting-android17, queue, queue-android17, social, social-android17, quotes, quotes-android17, author, author-android17, images, images-android17, videos, videos-android17, profiles, profiles-android17, usernames, usernames-android17, video-public, video-public-android17, registry-public, registry-public-android17]
      public_feed_read:
        description: Enable public reads for focused scopes (full suites always include all public-read gates)
        type: boolean
        default: false
      public_video_reference:
        description: Use the second signed public YouTube reference in opt-in video reads
        type: boolean
        default: false
      performance_version:
        description: Optional immutable signed performance version for isolated installation proof
        type: string
        default: ''
      main_reference_version:
        description: Signed main preview reference beside performance (29 or 35)
        type: choice
        options: ['29', '35']
        default: '29'
      android17_16kb:
        description: Use the experimental Android 17 x86_64 16 KB image
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-proof-${{ github.ref }}-${{ inputs.scope || 'source' }}${{ inputs.android17_16kb && '-16kb' || '' }}
  cancel-in-progress: true
jobs:
  native-proof:
    name: native-proof (${{ matrix.partition }})
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON((inputs.scope == 'full-android17' || inputs.scope == 'full-android10') && '["chat","social","wallet"]' || '["all"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.scope == 'full' && 120 || startsWith(inputs.scope, 'full-') && 75 || 60 }}
    steps:
      - name: Validate optional 16 KB environment
        if: inputs.android17_16kb
        env:
          VERIFICATION_SCOPE: ${{ inputs.scope }}
        run: |
          case "$VERIFICATION_SCOPE" in
            full|*-android17) ;;
            *) echo 'The 16 KB choice requires an Android17 scope or full' >&2; exit 2 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            settings.gradle.kts
            build.gradle.kts
            core/build.gradle.kts
            app/build.gradle.kts
            push-gateway/build.gradle.kts
            gradle/wrapper/gradle-wrapper.properties
      - name: Locate dependency cache
        id: cache-path
        run: echo "home=$HOME" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies from the earlier proof cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: redsquare-gradle-v1-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'app/build.gradle.kts', 'push-gateway/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Restore verified build dependencies
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-path.outputs.home }}/.gradle/caches
          key: redsquare-gradle-v2-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'app/build.gradle.kts', 'push-gateway/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            redsquare-gradle-v2-
            setup-java-Linux-x64-gradle-
      - name: Restore Gradle task outputs
        id: task-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-path.outputs.home }}/.gradle/caches/build-cache-1
          # Gradle checks each task's inputs. Reuse one seed per build configuration
          # instead of storing another multi-GB snapshot for every source commit.
          key: redsquare-gradle-tasks-v2-${{ runner.os }}-${{ hashFiles('gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'app/build.gradle.kts', 'push-gateway/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            redsquare-gradle-tasks-v1-${{ runner.os }}-${{ hashFiles('gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'app/build.gradle.kts', 'push-gateway/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Check runner SDK and acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          # This Kotlin/JVM proof does not use the runner's large native SDKs.
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 libgl1 libnss3 libasound2t64 libx11-6 libxcb1 libxkbcommon0 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxtst6 libxdamage1 libglib2.0-0t64
          scripts/ci-android-setup
          java -version
          "$ANDROID_HOME/emulator/emulator" -version
      - name: Build and verify native sources
        id: build
        env:
          VERIFICATION_SCOPE: ${{ inputs.scope || 'source' }}
        run: |
          if [[ "$VERIFICATION_SCOPE" == full* || "$VERIFICATION_SCOPE" == source || "$VERIFICATION_SCOPE" == release-tail* ]]; then
            ./gradlew --no-daemon --console=plain :core:test :push-gateway:test :core:writeHostPeerClasspath :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug :app:assemblePerformance :app:lintPerformance
          else
            ./gradlew --no-daemon --console=plain :core:test :push-gateway:test :core:writeHostPeerClasspath :app:assembleDebug :app:assembleDebugAndroidTest
          fi
      - name: Restore pinned TalkBack tool
        if: (startsWith(inputs.scope, 'status-talkback') || (startsWith(inputs.scope, 'full') && (matrix.partition == 'chat' || matrix.partition == 'all')))
        id: talkback-tool
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .scratch/talkback-tool/artifacts
          key: talkback-x86_64-229212f-${{ hashFiles('scripts/ci-talkback-setup') }}
      - name: Build or verify pinned TalkBack tool
        if: (startsWith(inputs.scope, 'status-talkback') || (startsWith(inputs.scope, 'full') && (matrix.partition == 'chat' || matrix.partition == 'all')))
        run: scripts/ci-talkback-setup
      - name: Retain pinned TalkBack tool
        if: (startsWith(inputs.scope, 'status-talkback') || (startsWith(inputs.scope, 'full') && (matrix.partition == 'chat' || matrix.partition == 'all'))) && steps.talkback-tool.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .scratch/talkback-tool/artifacts
          key: ${{ steps.talkback-tool.outputs.cache-primary-key }}
      - name: Retain Gradle task outputs before device tests
        if: steps.build.outcome == 'success' && steps.task-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-path.outputs.home }}/.gradle/caches/build-cache-1
          key: ${{ steps.task-cache.outputs.cache-primary-key }}
      - name: Retain dependencies before device tests
        if: steps.build.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-path.outputs.home }}/.gradle/caches
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Verify Android 10 runtime
        if: inputs.scope != 'composer-focus-android17' && inputs.scope != 'post-presentation-android17' && github.event_name == 'workflow_dispatch' && inputs.scope != 'status-motion-android17' && inputs.scope != 'status-talkback-android17' && inputs.scope != 'status-recovery-android17' && inputs.scope != 'social-repeat-process-android17' && inputs.scope != 'social-isolation-android17' && inputs.scope != 'social-import-android17' && inputs.scope != 'social-repeat-android17' && inputs.scope != 'social-push-dismissal-android17' && inputs.scope != 'private-push-dismissal-android17' && inputs.scope != 'private-history-viewport-android17' && inputs.scope != 'app-frame-reading-android17' && inputs.scope != 'app-frame-motion-zero-android17' && inputs.scope != 'app-frame-motion-android17' && inputs.scope != 'app-frame-android17' && inputs.scope != 'app-frame-viewport-android17' && inputs.scope != 'publisher-routes-android17' && inputs.scope != 'private-push-mute-android17' && inputs.scope != 'chat-push-capacity-android17' && inputs.scope != 'group-push-android17' && inputs.scope != 'chat-alerts-android17' && inputs.scope != 'chat-history-process-android17' && inputs.scope != 'chat-gifs-android17' && inputs.scope != 'gifs-android17' && inputs.scope != 'social-push-process-android17' && inputs.scope != 'social-push-android17' && inputs.scope != 'chat-viewport-android17' && inputs.scope != 'chat-keyboard-android17' && inputs.scope != 'chat-photo-process-android17' && inputs.scope != 'chat-image-storage-android17' && inputs.scope != 'chat-images-android17' && inputs.scope != 'chat-mute-android17' && inputs.scope != 'release-tail-android17' && inputs.scope != 'chat-queue-process-android17' && inputs.scope != 'chat-queue-group-android17' && inputs.scope != 'chat-queue-android17' && inputs.scope != 'group-admin-android17' && inputs.scope != 'group-ui-android17' && inputs.scope != 'beta-ui-android17' && inputs.scope != 'full-android17' && inputs.scope != 'feed-android17' && inputs.scope != 'update-android17' && inputs.scope != 'export-android17' && inputs.scope != 'import-android17' && inputs.scope != 'import-risk-android17' && inputs.scope != 'import-storage-android17' && inputs.scope != 'browse-android17' && inputs.scope != 'following-android17' && inputs.scope != 'posting-android17' && inputs.scope != 'queue-android17' && inputs.scope != 'social-android17' && inputs.scope != 'quotes-android17' && inputs.scope != 'author-android17' && inputs.scope != 'images-android17' && inputs.scope != 'videos-android17' && inputs.scope != 'profiles-android17' && inputs.scope != 'usernames-android17' && inputs.scope != 'video-public-android17' && inputs.scope != 'registry-public-android17' && inputs.scope != 'search-android17' && inputs.scope != 'controls-android17' && inputs.scope != 'reports-android17' && inputs.scope != 'transfers-android17' && inputs.scope != 'notifications-android17' && inputs.scope != 'chat-android17' && inputs.scope != 'chat-ui-android17' && inputs.scope != 'chat-actions-android17' && inputs.scope != 'chat-public-android17' && inputs.scope != 'policies-android17' && inputs.scope != 'agreement-android17' && inputs.scope != 'agreement-recovery-android17' && inputs.scope != 'agreement-surfaces-android17' && inputs.scope != 'agreement-group-android17'
        env:
          TEST_MAIN_REFERENCE_VERSION: ${{ inputs.main_reference_version || '29' }}
          TEST_PERFORMANCE_VERSION: ${{ inputs.performance_version || '' }}
          TEST_PUBLIC_SIGNED_UPDATE: '1'
          TEST_PUBLIC_FEED_READ: ${{ (startsWith(inputs.scope, 'full') || inputs.public_feed_read) && '1' || '0' }}
          TEST_PUBLIC_VIDEO_REFERENCE: ${{ inputs.public_video_reference && '1' || '0' }}
          TEST_PARTITION: ${{ matrix.partition }}
          TEST_SCOPE: ${{ inputs.scope == 'full-android10' && 'full' || inputs.scope || 'full' }}
        run: scripts/ci-android-device 29
      - name: Verify Android 17 runtime
        if: inputs.scope != 'composer-focus' && inputs.scope != 'post-presentation' && github.event_name == 'workflow_dispatch' && inputs.scope != 'status-motion' && inputs.scope != 'status-talkback' && inputs.scope != 'status-recovery' && inputs.scope != 'social-repeat-process' && inputs.scope != 'social-isolation' && inputs.scope != 'social-import' && inputs.scope != 'social-repeat' && inputs.scope != 'social-push-dismissal' && inputs.scope != 'private-push-dismissal' && inputs.scope != 'private-history-viewport' && inputs.scope != 'app-frame-reading' && inputs.scope != 'app-frame-motion-zero' && inputs.scope != 'app-frame-motion' && inputs.scope != 'app-frame' && inputs.scope != 'app-frame-viewport' && inputs.scope != 'publisher-routes' && inputs.scope != 'private-push-mute' && inputs.scope != 'chat-push-capacity' && inputs.scope != 'group-push' && inputs.scope != 'chat-alerts' && inputs.scope != 'chat-history-process' && inputs.scope != 'chat-gifs' && inputs.scope != 'gifs' && inputs.scope != 'social-push-process' && inputs.scope != 'social-push' && inputs.scope != 'chat-viewport' && inputs.scope != 'chat-keyboard' && inputs.scope != 'chat-photo-process' && inputs.scope != 'chat-image-storage' && inputs.scope != 'chat-images' && inputs.scope != 'chat-mute' && inputs.scope != 'release-tail' && inputs.scope != 'chat-queue-process' && inputs.scope != 'chat-queue-group' && inputs.scope != 'chat-queue' && inputs.scope != 'group-admin' && inputs.scope != 'group-ui' && inputs.scope != 'beta-ui' && inputs.scope != 'full-android10' && inputs.scope != 'feed' && inputs.scope != 'export' && inputs.scope != 'import' && inputs.scope != 'import-risk' && inputs.scope != 'import-storage' && inputs.scope != 'browse' && inputs.scope != 'following' && inputs.scope != 'posting' && inputs.scope != 'queue' && inputs.scope != 'social' && inputs.scope != 'quotes' && inputs.scope != 'author' && inputs.scope != 'images' && inputs.scope != 'videos' && inputs.scope != 'profiles' && inputs.scope != 'usernames' && inputs.scope != 'video-public' && inputs.scope != 'registry-public' && inputs.scope != 'search' && inputs.scope != 'controls' && inputs.scope != 'reports' && inputs.scope != 'transfers' && inputs.scope != 'notifications' && inputs.scope != 'chat' && inputs.scope != 'chat-ui' && inputs.scope != 'chat-actions' && inputs.scope != 'chat-public' && inputs.scope != 'policies' && inputs.scope != 'agreement' && inputs.scope != 'agreement-recovery' && inputs.scope != 'agreement-surfaces' && inputs.scope != 'agreement-group'
        env:
          TEST_PAGE_SIZE: ${{ inputs.android17_16kb && '16384' || 'default' }}
          TEST_MAIN_REFERENCE_VERSION: ${{ inputs.main_reference_version || '29' }}
          TEST_PERFORMANCE_VERSION: ${{ inputs.performance_version || '' }}
          TEST_PARTITION: ${{ matrix.partition }}
          TEST_SCOPE: ${{ inputs.scope == 'full-android17' && 'full' || inputs.scope || 'full' }}
          TEST_PUBLIC_SIGNED_UPDATE: '1'
          TEST_PUBLIC_FEED_READ: ${{ (startsWith(inputs.scope, 'full') || inputs.public_feed_read) && '1' || '0' }}
          TEST_PUBLIC_VIDEO_REFERENCE: ${{ inputs.public_video_reference && '1' || '0' }}
        run: scripts/ci-android-device 37.0
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-proof${{ matrix.partition != 'all' && format('-{0}', matrix.partition) || '' }}
          path: |
            .scratch/device-evidence/
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html
          include-hidden-files: true
          retention-days: 14
