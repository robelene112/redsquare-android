name: Spaces native prototype
on:
  push:
    branches: [codex/spaces-native-prototype]
    paths: ['prototypes/spaces-native/src/**', 'prototypes/spaces-native/*.gradle.kts', 'prototypes/spaces-native/gradle.properties', '.github/workflows/spaces-prototype.yml']
permissions:
  contents: read
concurrency:
  group: spaces-native-prototype
  cancel-in-progress: true
jobs:
  prototype:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: '29', image: 'system-images;android-29;default;x86_64', font: '1.0', density: '420', size: '1080x1920', name: android10}
          - {api: '37.0', image: 'system-images;android-37.0;google_apis;x86_64', font: '1.0', density: '420', size: '1080x1920', name: android17}
          - {api: '37.0', image: 'system-images;android-37.0;google_apis;x86_64', font: '2.0', density: '480', size: '960x1800', name: compact-large-text}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            prototypes/spaces-native
            third-party/compose-rich-editor
            app/src/main/res
            app/src/main/kotlin/nl/davidengelen/redsquare/ui
            gradle
            scripts
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build the isolated prototype
        run: |
          scripts/ci-android-setup
          ./gradlew --no-daemon -p prototypes/spaces-native :assembleDebug :assembleDebugAndroidTest :lintDebug
      - name: Native phone journeys
        env:
          PROTOTYPE_IMAGE: ${{ matrix.image }}
          PROTOTYPE_FONT: ${{ matrix.font }}
          PROTOTYPE_DENSITY: ${{ matrix.density }}
          PROTOTYPE_SIZE: ${{ matrix.size }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p .scratch/spaces-prototype
          git rev-parse HEAD > .scratch/spaces-prototype/source.txt
          scripts/ci-sdk-install "$(command -v sdkmanager)" "$PROTOTYPE_IMAGE" platform-tools
          test -x "$ANDROID_HOME/platform-tools/adb"
          sudo chmod a+rw /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/spaces-device"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd -n spaces-prototype -k "$PROTOTYPE_IMAGE"
          test -f "$ANDROID_AVD_HOME/spaces-prototype.ini"
          sed -i '/^vm[.]heapSize=/d; /^disk[.]dataPartition[.]size=/d; /^hw[.]lcd[.]width=/d; /^hw[.]lcd[.]height=/d; /^hw[.]lcd[.]density=/d' "$ANDROID_AVD_HOME/spaces-prototype.avd/config.ini"
          printf '%s\n' 'vm.heapSize=512' 'disk.dataPartition.size=2G' "hw.lcd.width=${PROTOTYPE_SIZE%x*}" "hw.lcd.height=${PROTOTYPE_SIZE#*x}" "hw.lcd.density=$PROTOTYPE_DENSITY" >> "$ANDROID_AVD_HOME/spaces-prototype.avd/config.ini"
          cp "$ANDROID_AVD_HOME/spaces-prototype.avd/config.ini" .scratch/spaces-prototype/avd-config.ini
          emulator -avd spaces-prototype -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -feature -Vulkan -cores 2 -memory 2048 > .scratch/spaces-prototype/emulator.log 2>&1 &
          TASK_EMULATOR_PID=$!
          trap 'kill "$TASK_EMULATOR_PID" 2>/dev/null || true' EXIT
          adb start-server
          TASK_BOOT_DEADLINE=$((SECONDS+240))
          TASK_BOOTED=0
          while (( SECONDS < TASK_BOOT_DEADLINE )); do
            if ! kill -0 "$TASK_EMULATOR_PID" 2>/dev/null; then tail -50 .scratch/spaces-prototype/emulator.log; exit 1; fi
            if [[ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then TASK_BOOTED=1; break; fi
            sleep 2
          done
          if [[ "$TASK_BOOTED" != 1 ]]; then tail -50 .scratch/spaces-prototype/emulator.log; exit 1; fi
          timeout 10 adb shell getprop dalvik.vm.heapsize > .scratch/spaces-prototype/runtime-heap.txt
          adb shell input keyevent 82
          adb shell wm size "$PROTOTYPE_SIZE"
          adb shell wm density "$PROTOTYPE_DENSITY"
          adb shell settings put system font_scale "$PROTOTYPE_FONT"
          { adb shell wm size; adb shell wm density; adb shell settings get system font_scale; } > .scratch/spaces-prototype/actual-display.txt
          python3 - <<'PYAPK'
          import json, pathlib, subprocess
          for location in ('debug', 'androidTest/debug'):
              directory=pathlib.Path('prototypes/spaces-native/build/outputs/apk')/location
              metadata=json.loads((directory/'output-metadata.json').read_text())
              assert len(metadata['elements']) == 1
              subprocess.run(['adb','install',str(directory/metadata['elements'][0]['outputFile'])],check=True)
          PYAPK
          set +e
          timeout 480 adb shell am instrument -w -r -e expectedWidthDp "$(( ${PROTOTYPE_SIZE%x*} * 160 / PROTOTYPE_DENSITY ))" -e expectedDensity "$PROTOTYPE_DENSITY" -e expectedFont "$PROTOTYPE_FONT" nl.davidengelen.redsquare.spaces.prototype.test/androidx.test.runner.AndroidJUnitRunner | tee .scratch/spaces-prototype/instrumentation.txt
          TASK_TEST_EXIT=${PIPESTATUS[0]}
          set -e
          timeout 30 adb logcat -d > .scratch/spaces-prototype/logcat.txt || true
          timeout 60 adb pull /sdcard/Android/data/nl.davidengelen.redsquare.spaces.prototype/files/prototype-evidence .scratch/spaces-prototype/ || true
          test "$TASK_TEST_EXIT" == 0
          grep -q 'OK (12 tests)' .scratch/spaces-prototype/instrumentation.txt
          ! grep -Eq 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' .scratch/spaces-prototype/instrumentation.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: spaces-prototype-${{ matrix.name }}
          path: |
            .scratch/spaces-prototype/
            prototypes/spaces-native/build/outputs/apk/
            prototypes/spaces-native/build/reports/lint-results-debug.html
          include-hidden-files: true
          retention-days: 14
