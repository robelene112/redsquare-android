[package]
name = "saito-spaces-mls"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false

[lib]
name = "saito_spaces_mls"
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = "=0.9.0"
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
jni = "=0.21.1"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
